class Wrap{constructor(nodes){this.nodes=nodes;nodes.forEach((n,i)=>this[i]=n);this.length=nodes.length;}
 find(s){return new Wrap(this.nodes.flatMap(n=>[...n.querySelectorAll(s.replaceAll(':input',':is(input,textarea,select,button)'))]));}html(v){if(v===undefined)return this.nodes[0]?.innerHTML;this.nodes.forEach(n=>n.innerHTML=v);return this;}text(v){if(v===undefined)return this.nodes[0]?.textContent;this.nodes.forEach(n=>n.textContent=v);return this;}
 append(v){this.nodes.forEach(n=>typeof v==='string'?n.insertAdjacentHTML('beforeend',v):n.append(...(v instanceof Wrap?v.nodes:[v])));return this;}appendTo(v){$(v).append(this);return this;}
 val(v){if(v===undefined)return this.nodes[0]?.value;this.nodes.forEach(n=>n.value=v);return this;}attr(k,v){if(v===undefined)return this.nodes[0]?.getAttribute(k);this.nodes.forEach(n=>n.setAttribute(k,v));return this;}removeAttr(k){this.nodes.forEach(n=>n.removeAttribute(k));return this;}
 prop(k,v){this.nodes.forEach(n=>n[k]=v);return this;}toggle(v){this.nodes.forEach(n=>n.style.display=v?'':'none');return this;}hide(){return this.toggle(false);}show(){return this.toggle(true);}empty(){return this.html('');}
 trigger(k){this.nodes.forEach(n=>k==='focus'?n.focus():n.dispatchEvent(new Event(k,{bubbles:true})));return this;}
 on(type,selector,fn){if(typeof selector==='function'){fn=selector;selector=null;}const event=type.split('.')[0];this.nodes.forEach(n=>{const f=e=>{const target=selector?e.target.closest(selector):n;if(target&&n.contains(target)){const eventView={currentTarget:target,key:e.key,shiftKey:e.shiftKey,ctrlKey:e.ctrlKey,altKey:e.altKey,metaKey:e.metaKey,preventDefault:()=>e.preventDefault(),stopPropagation:()=>e.stopPropagation()};fn(eventView);eventView.currentTarget=null;}};(n.handlers??=[]).push([event,f]);n.addEventListener(event,f);});return this;}
 off(){this.nodes.forEach(n=>(n.handlers||[]).forEach(([event,f])=>n.removeEventListener(event,f)));return this;}}
window.$=value=>{if(value instanceof Wrap)return value;if(typeof value==='string'&&value.startsWith('<')){const t=document.createElement('template');t.innerHTML=value;return new Wrap([...t.content.children]);}return new Wrap(typeof value==='string'?[...document.querySelectorAll(value)]:[value]);};
const results=[];function check(value,text){if(!value)throw new Error(text);results.push(text);}const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(predicate){for(let n=0;n<200;n++){if(predicate())return;await pause(25);}throw new Error('Timed out: '+predicate.toString());}
const nativeHTML=(rows=5)=>`<!doctype html><style>.print-format{width:80mm;box-sizing:border-box;font:13px Arial;padding:8px}table{width:100%;border-collapse:collapse}td{padding:5px;border-bottom:1px solid #aaa}.qr{width:110px;height:110px}</style><div class="print-format"><h3>Demo native Print Format</h3><p>Customer ABC · Kuala Lumpur</p><table>${Array.from({length:rows},(_,i)=>`<tr><td>ITEM-${i+1} · Plastic bag</td><td>${i+1} Nos</td><td>RM 2.00</td></tr>`).join('')}</table><p>TAIL-MARKER-${rows} · Grand Total RM 10.00</p><img class="qr" src="data:image/svg+xml;base64,${btoa('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="white"/><path d="M0 0h30v30H0zM70 0h30v30H70zM0 70h30v30H0zM50 50h10v50H50zM70 70h30v30H70z" fill="black"/></svg>')}"></div>`;

  const multi=await bridge.render(nativeHTML()+nativeHTML(),settings);check(multi.reduce((n,f)=>n+f.height,0)>short.reduce((n,f)=>n+f.height,0),'Retained all native print-format roots');
  const first=short[0];const preview=document.createElement('canvas');preview.width=first.width;preview.height=first.height;const ctx=preview.getContext('2d'),pixels=ctx.createImageData(first.width,first.height);for(let n=0;n<first.width*first.height;n++){const v=first.bytes[n>>3]&(128>>(n&7))?0:255;pixels.data.set([v,v,v,255],n*4);}ctx.putImageData(pixels,0,0);preview.style.maxWidth='320px';document.body.append(preview);

  let scripted=false;try{await bridge.render(nativeHTML().replace('<h3>','<script>void 0;<\/script><h3>'),settings);}catch(_){scripted=true;}check(scripted,'Rejected script-dependent formats rather than dropping their content');

  const fakeF={utils:{escape_html:v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')},ui:{form:{make_control({parent,df}){const label=document.createElement('label');label.textContent=df.label;const el=document.createElement(df.fieldtype==='Table'?'div':df.fieldtype==='Select'?'select':df.fieldtype==='Small Text'?'textarea':'input');el.dataset.field=df.fieldname;if(df.fieldtype==='Password')el.type='password';if(df.fieldtype==='Check')el.type='checkbox';$(parent).append(label).append(el);let rows=df.fieldtype==='Table'?structuredClone(df.data||df.default||[]):null;function refresh(){if(df.fieldtype==='Table'){el.innerHTML='';for(const row of rows){const group=document.createElement('div');for(const col of df.fields||[]){const input=document.createElement('input');input.dataset.column=col.fieldname;input.value=row[col.fieldname]??'';input.disabled=!!col.read_only;input.addEventListener('change',()=>row[col.fieldname]=input.value);group.append(input);}el.append(group);}return;}if(df.fieldtype==='Select'){el.innerHTML='';for(const o of df.options||[]){const option=document.createElement('option');option.value=typeof o==='string'?o:o.value;option.textContent=typeof o==='string'?o:o.label;el.append(option);}}}refresh();el.addEventListener('change',()=>df.change?.());return {df,$input:$(el),grid:df.fieldtype==='Table'?{get_data:()=>rows}:undefined,refresh,get_value:()=>df.fieldtype==='Table'?rows:df.fieldtype==='Check'?Number(el.checked):el.value,set_value(v){if(df.fieldtype==='Table'){rows=structuredClone(v);refresh();return Promise.resolve();}const old=el.value;if(df.fieldtype==='Check')el.checked=!!v;else el.value=v??'';if(old!==el.value)df.change?.();return Promise.resolve();}};}}},
   async call({method,args}){calls.push({method,args});const fn=method.split('.').at(-1);if(fn==='get_mobile_print_context')return {message:structuredClone(context)};if(fn==='get_driver_invoice_requirements')return {message:{delivery_note:args.delivery_note,fields:[{fieldname:'items',label:'Invoice Items',scope:'table',default:[{item_code:'BAG',qty:5,rate:2,custom_mandatory:''}],fields:[{fieldname:'item_code',label:'Item',fieldtype:'Data',read_only:1},{fieldname:'qty',label:'Qty',fieldtype:'Float',read_only:1},{fieldname:'rate',label:'Rate',fieldtype:'Currency',read_only:1},{fieldname:'custom_mandatory',label:'Custom mandatory reference',fieldtype:'Data',reqd:1}]}],doctype:'Sales Invoice',invoice_mode:'Draft',profile_version:invoiceVersion}};
    if(fn==='get_mobile_print_job'){if(args.print_job==='STALE')throw Object.assign(new Error('Document or Print Format changed'),{exc_type:'ValidationError'});return {message:structuredClone(jobs[args.print_job])};}
    const key=args.event_token;if(fn==='reconcile_driver_action')return {message:receipts.get(key)||{status:'Not Recorded'}};
    if(fn!=='perform_driver_action')throw new Error(fn);if(receipts.has(key))return {message:receipts.get(key)};
    const p=args.payload,result={};if(args.action==='Prepare Mobile Print'){result.print_job='JOB1';jobs.JOB1={name:'JOB1',html:nativeHTML(),render_hash:'HASH',copies:1,status:'Prepared',segments:{},print_format:p.print_format,document_name:'DN'};context.active_jobs=[{name:'JOB1',document_name:'DN',status:'Prepared'}];}
    if(args.action==='Record Print Segment'){const job=jobs[p.print_job],prior=job.segments.pages?.[p.page];if(p.outcome==='Awaiting Confirmation'&&prior&&!p.reason)throw Object.assign(new Error('Give a retry reason'),{exc_type:'ValidationError'});job.segments.hashes=p.frame_hashes;job.segments.pages??={};job.segments.pages[p.page]={status:p.outcome};result.print_job=job.name;result.page=p.page;result.outcome=p.outcome;result.job_status='Awaiting Confirmation';}

    if(args.action==='Create Custody Label')result.custody_label='KRC-1';
    if(args.action==='Close Mobile Print'){if(!p.reason)throw Object.assign(new Error('Give a reason to close'),{exc_type:'ValidationError'});result.print_job=p.print_job;result.job_status='Abandoned';context.active_jobs=[];}
    const receipt={status:'Recorded',action:args.action,result};receipts.set(key,receipt);if(loss===args.action){loss=null;throw new Error('Lost response');}return {message:receipt};}};
  const uiBridge={...bridge,render:async(...args)=>{if(renderMode==='reject')throw new Error('Unsupported Print Format style');if(renderMode==='timeout')return bridge.render(args[0],args[1],{html2canvas:()=>new Promise(()=>{}),timeoutMs:500});return bridge.render(...args);}};
  const fakeRoot={document,location:{origin:location.origin,set href(uri){opened.push(uri);}},cfg_mobile_print_bridge:uiBridge,cfg_driver_route_actions:window.cfg_driver_route_actions,cfg_delivery_action_scanner:window.cfg_delivery_action_scanner,cfg_dispatch_recovery:window.cfg_dispatch_recovery,open:(...args)=>opened.push(args)};
  const source=await(await fetch('../../public/js/driver_mobile_print.js')).text();new Function('window','module',source)(fakeRoot,undefined);
  let panel;const start=()=>panel=fakeRoot.cfg_driver_mobile_print.open({frappe:fakeF,host:$('#host'),trip:'TRIP',stop:'STOP',owner:()=>lead,token:()=>session,active:()=>true,storage:store,locks:navigator.locks,nonce:()=>crypto.randomUUID(),error:e=>e.message,refresh:async()=>refreshes++,onClose(){}});
  const control=name=>document.querySelector('[data-field="'+name+'"]');const set=(name,value)=>{control(name).value=value;control(name).dispatchEvent(new Event('change',{bubbles:true}));};const click=name=>document.querySelector('[data-mobile="'+name+'"]').click();
  start();await until(()=>!!control('document'));await panel.scan('DN');await pause(10);check(control('format').value==='CUSTOM80','Selected office native Print Format by default');check(document.querySelector('.cfg-mobile-native').href.includes('format=CUSTOM80'),'Normal ERPNext print uses selected native format');
  context.active_jobs=[{name:'OTHER-JOB',document_name:'DN',status:'Prepared',operator:'OTHER',delivery_trip:'OLD-TRIP',stop_key:'OLD-STOP',can_resume:false}];
  await panel.refresh();check(!document.querySelector('[data-mobile="resume"]'),'Another operator print job has no Resume authority');
  check(document.querySelector('a[href*="cfg-kanban-mobile-print-job/OTHER-JOB"]')?.textContent.includes('Office Recovery'),'Displayed an office recovery link for a globally blocking job');
  check(document.querySelector('.cfg-mobile-body').textContent.includes('OLD-TRIP'),'Displayed original Trip for the hidden blocking job');
  context.active_jobs=[{name:'STALE',document_name:'DN',status:'Prepared',stop_key:'OLD-STOP',can_resume:true}];click('back');await until(()=>!!document.querySelector('[data-job="STALE"]'));
  check(!document.querySelector('a[href*="OTHER-JOB"]'),'Documents reloads the current unfinished-job list after office recovery');
  document.querySelector('[data-job="STALE"]').click();await until(()=>document.querySelector('.cfg-mobile-message').textContent.includes('Print Format changed'));
  check(!!document.querySelector('[data-mobile="abandon"]'),'Kept reasoned closure available when a stale job cannot render');
  check(document.activeElement===document.querySelector('.cfg-mobile-scan'),'Restored scanner focus after stale-preview rejection');
  const printsBefore=calls.filter(c=>c.args.action==='Prepare Mobile Print').length;
  set('reason','Old preview changed; checked the paper');click('abandon');await until(()=>!!control('document')&&!panel.controller.state.busy);
  check(calls.some(c=>c.args.action==='Close Mobile Print'&&c.args.payload.print_job==='STALE'&&c.args.stop_key==='OLD-STOP'),'Closed the exact stale job with its reason and original stop');
  check(calls.filter(c=>c.args.action==='Prepare Mobile Print').length===printsBefore,'Recovery does not automatically prepare or resend a print');
  await panel.scan('DN');
  loss='Prepare Mobile Print';click('confirm');await until(()=>!!panel.controller.state.pending&&!panel.controller.state.busy);const originalPrint=panel.controller.state.pending.id;await panel.scan('DN2');check(control('document').value==='1','Frozen an uncertain print request against later physical scans');await panel.scan('CFG:CMD:CONFIRM');check(calls.filter(c=>c.method.endsWith('perform_driver_action')&&c.args.action==='Prepare Mobile Print').every(c=>c.args.event_token===originalPrint),'Scanner retry retained original print identity');await until(()=>!!control('signing_key')&&!document.querySelector('[data-mobile=pair]').disabled);set('signing_key','0'.repeat(32));click('pair');await until(()=>document.querySelector('.cfg-mobile-message').textContent.includes('paired'));check(!control('signing_key').value,'Cleared pairing key input');
  click('confirm');await until(()=>!!document.querySelector('.cfg-mobile-open-bridge'));document.querySelector('.cfg-mobile-open-bridge').click();check(opened.length===1&&opened[0].startsWith('labelbridge://print?'),'Opened signed handoff only after explicit user action');check(!document.querySelector('.cfg-mobile-open-bridge'),'Cannot click the same handoff twice');
  click('unknown');await until(()=>jobs.JOB1.segments.pages?.[1]?.status==='Outcome Unknown'&&!panel.controller.state.busy);const before=calls.filter(c=>c.args.action==='Record Print Segment').length;await pause(30);check(calls.filter(c=>c.args.action==='Record Print Segment').length===before,'Unknown physical outcome does not automatically retry');
  click('confirm');await until(()=>document.querySelector('.cfg-mobile-message').textContent.includes('retry reason'));check(!document.querySelector('.cfg-mobile-open-bridge'),'Retry without a reason cannot arm a new handoff');
  set('reason','App failed, checked paper');click('confirm');await until(()=>!!document.querySelector('.cfg-mobile-open-bridge')&&!panel.controller.state.busy);check(opened.length===1,'Preparing a retry does not automatically open companion app');

  invoiceVersion='POLICY2';click('invoice');await until(()=>document.querySelector('.cfg-mobile-message').textContent.includes('policy changed'));click('confirm');await pause(50);check(!calls.some(c=>c.args.action==='Create Sales Invoice'),'Policy change after review did not create or submit an Invoice');invoiceVersion='POLICY1';await panel.refresh();click('invoice');await until(()=>!!document.querySelector('[data-column=custom_mandatory]'));await pause(50);check(document.querySelector('[data-column=qty]').disabled&&document.querySelector('[data-column=rate]').disabled,'Kept commercial Item columns read-only in the required-input editor');await panel.scan('CFG:SELECT:2');await panel.scan('CFG:CMD:DELIVERY_ADD_ROW');check(document.querySelectorAll('[data-column=custom_mandatory]').length===1,'Scanner cannot add extra Invoice source rows');await panel.scan('CFG:CMD:DELIVERY_NEXT_ROW');await panel.scan('TRACE-REF');click('confirm');await until(()=>document.querySelector('.cfg-mobile-message').textContent.includes('Invoice INV1'));check(calls.filter(c=>c.args.action==='Create Sales Invoice').length===1,'Separate invoice action creates Draft once');check(calls.find(c=>c.args.action==='Create Sales Invoice').args.payload.required_erp_inputs.tables.items[0].custom_mandatory==='TRACE-REF','Captured permitted custom mandatory data without replacing mapped Items');
  click('label');await until(()=>!!control('return_line'));set('return_line','1');loss='Create Custody Label';click('confirm');await until(()=>!!panel.controller.state.pending&&!panel.controller.state.busy);const pendingId=panel.controller.state.pending.id;panel.close();start();await until(()=>!!control('document'));click('readback');await until(()=>!panel.controller.state.pending);check(calls.filter(c=>c.args.action==='Create Custody Label'&&c.method.endsWith('perform_driver_action')).length===1,'Lost custody response reconciles original request without allocating twice');check(receipts.has(pendingId),'Retained original custody action identity');
