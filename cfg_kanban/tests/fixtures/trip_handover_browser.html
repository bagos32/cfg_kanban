<script src="../../public/js/trip_handover.js"></script><script>
class Wrap{constructor(nodes){this.nodes=nodes;nodes.forEach((n,i)=>this[i]=n);this.length=nodes.length;}
 find(s){return new Wrap(this.nodes.flatMap(n=>[...n.querySelectorAll(s.replaceAll(':input',':is(input,textarea,select,button)'))]));}html(v){if(v===undefined)return this.nodes[0]?.innerHTML;this.nodes.forEach(n=>n.innerHTML=v);return this;}text(v){if(v===undefined)return this.nodes[0]?.textContent;this.nodes.forEach(n=>n.textContent=v);return this;}
 append(v){this.nodes.forEach(n=>typeof v==='string'?n.insertAdjacentHTML('beforeend',v):n.append(...(v instanceof Wrap?v.nodes:[v])));return this;}appendTo(v){$(v).append(this);return this;}
 val(v){if(v===undefined)return this.nodes[0]?.value;this.nodes.forEach(n=>n.value=v);return this;}attr(k,v){if(v===undefined)return this.nodes[0]?.getAttribute(k);this.nodes.forEach(n=>n.setAttribute(k,v));return this;}removeAttr(k){this.nodes.forEach(n=>n.removeAttribute(k));return this;}
 prop(k,v){this.nodes.forEach(n=>n[k]=v);return this;}toggle(v){this.nodes.forEach(n=>n.style.display=v?'':'none');return this;}hide(){return this.toggle(false);}show(){return this.toggle(true);}empty(){return this.html('');}
 trigger(k){this.nodes.forEach(n=>k==='focus'?n.focus():n.dispatchEvent(new Event(k,{bubbles:true})));return this;}
 on(type,selector,fn){if(typeof selector==='function'){fn=selector;selector=null;}const event=type.split('.')[0];this.nodes.forEach(n=>{const f=e=>{const target=selector?e.target.closest(selector):n;if(target&&n.contains(target)){const eventView={currentTarget:target,key:e.key,shiftKey:e.shiftKey,ctrlKey:e.ctrlKey,altKey:e.altKey,metaKey:e.metaKey,preventDefault:()=>e.preventDefault(),stopPropagation:()=>e.stopPropagation()};fn(eventView);eventView.currentTarget=null;}};(n.handlers??=[]).push([event,f]);n.addEventListener(event,f);});return this;}
 hasClass(k){return !!this.nodes[0]?.classList.contains(k);}
 off(){this.nodes.forEach(n=>(n.handlers||[]).forEach(([event,f])=>n.removeEventListener(event,f)));return this;}}
window.$=value=>{if(value instanceof Wrap)return value;if(typeof value==='string'&&value.startsWith('<')){const t=document.createElement('template');t.innerHTML=value;return new Wrap([...t.content.children]);}return new Wrap(typeof value==='string'?[...document.querySelectorAll(value)]:[value]);};
const results=[];const check=(ok,text)=>{if(!ok)throw new Error(text);results.push(text);},pause=ms=>new Promise(r=>setTimeout(r,ms));
async function until(work){for(let i=0;i<200;i++){if(work())return;await pause(20);}throw new Error('Timed out: '+work);}
window.runHandoverTests=async()=>{
 const storage=localStorage;storage.clear();storage.setItem('cfg_kanban_operator_session','DEMO-TOKEN');
 const calls=[],opened=[],rows=[{dispatch_allocation:'ALLOC',handling_unit:'HU',visible_code:'TAG1',item_code:'PRODUCT',batch_no:'LOT1',stock_uom:'Nos',loaded_qty:5,delivered_qty:0,refused_qty:0,remaining_qty:5},{dispatch_allocation:'LOOSE',handling_unit:null,item_code:'LOOSE-ITEM',stock_uom:'Kg',loaded_qty:6,delivered_qty:0,refused_qty:0,remaining_qty:6}];
 const ctx={operator:{employee:'SUP-1',employee_name:'Demo Supervisor',kanban_role:'Supervisor'},can_manage:true,can_start:true,can_complete:true,trip:{name:'KTRIP-DEMO',title:'Kuala Lumpur route',company:'Demo Company',vehicle_warehouse:'Demo Lorry',driver:'Demo Driver (EMP-1)'},plans:[{name:'DPL-DEMO',customer:'Demo Customer',state:'Loaded',balances:rows}],returns:[{name:'KRTN-DEMO',customer:'Demo Customer',state:'Awaiting QC Receipt',stock_already_owned:false,items:[{item_code:'OLD-GOODS',stock_uom:'Nos',claimed_qty:2}]}],trips:[],lorry_stock:[{item_code:'PRODUCT',batch_no:'LOT1',qty:5,stock_uom:'Nos'}],return_start:0,boundary:'Old customer returns are separate non-stock custody.'};
 const detail={plan:{name:'DPL-DEMO'},review:{name:'KDR-DEMO',state:'Reviewing'},balance_hash:'HASH',balances:rows,recovery_routes:[{name:'RETURN',destination_warehouse:'Warehouse'},{name:'QC',destination_warehouse:'Quarantine'}]};let route=['kanban-trip-handover','KTRIP-DEMO'],camera=null,hiddenJob=false,failOnce=false;
 const f={session:{user:'demo@example.com'},get_route:()=>route,set_route(...next){opened.push(next);route=next;},ui:{make_app_page({parent}){return {main:$(parent)}} ,form:{make_control({parent,df}){const label=document.createElement('label');label.textContent=df.label;const el=document.createElement(df.fieldtype==='Small Text'?'textarea':'input');el.dataset.field=df.fieldname;$(parent).append(label).append(el);el.addEventListener('change',()=>df.onchange?.());return {df,$input:$(el),get_value:()=>el.value,set_value(v){el.value=v??'';df.onchange?.();return Promise.resolve();}};}},Scanner:class{constructor(options){this.options=options;camera=this;}hide_dialog(){}}},async call({method,args}){calls.push({method,args:structuredClone(args)});const name=method.split('.').at(-1);if(name==='get_trip_handover')return {message:structuredClone(ctx)};if(name==='get_plan_handover_context')return {message:structuredClone(detail)};if(name==='create_mixed_dispatch_recovery'){const groups=[{manifest:'KMF-RETURN',destination_warehouse:'Warehouse',state:'Draft'},{manifest:'KMF-QC',destination_warehouse:'Quarantine',state:'Draft'}];detail.mixed_recovery={active:true,groups,all_received:false};ctx.plans[0].mixed_recovery=detail.mixed_recovery;if(failOnce){failOnce=false;throw new Error('Lost response');}return {message:{}};}if(name==='login_operator')return {message:{session_token:'NEW-TOKEN'}};throw new Error('Unexpected '+name);}};
 window.frappe=f;window.jQuery=$;window.cfg_dispatch_recovery={async open(options){opened.push(['movement',options.planScan]);return {scan:v=>opened.push(['scan',v]),close(){options.onClose();}};}};window.cfg_dispatch_review={async open(options){opened.push(['review',options.planScan]);return {close(){options.onClose();}};}};
 const view=cfg_trip_handover.mount(document.getElementById('host'));await view.show('KTRIP-DEMO');
 const input=()=>document.querySelector('.handover-scan');const click=selector=>document.querySelector(selector).click();
 async function scan(value,key='Enter'){input().value=value;input().dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}));await pause(30);}
 async function chooseItem(number,destination,qty){await scan('CFG:CMD:HANDOVER_ITEMS');await scan('CFG:SELECT:'+number);await scan('CFG:CMD:HANDOVER_DESTINATION','Tab');await scan('CFG:SELECT:'+destination);if(qty)await scan('CFG:QTY:MATERIAL:'+qty);await scan('CFG:CMD:HANDOVER_ADD');}
 check(document.querySelector('.cfg-trip-handover').textContent.includes('Kuala Lumpur route'),'Actual full page renders Trip title, driver and stock summary');
 await scan('CFG:SELECT:1');await until(()=>view.app.state.detail);check(view.app.state.view==='items','Enter scanner selects the exact Plan and its source list');
 await scan('TAG1','Tab');check(view.app.state.item?.dispatch_allocation==='ALLOC','Tab-suffixed physical tag selects its predefined source');
 await chooseItem(1,1);await chooseItem(2,2,3);await chooseItem(2,3,3);
 check(view.app.state.choices.length===3,'Scanner-only choices keep one whole tag and split loose stock between destinations');
 check(document.activeElement===input(),'Scanner Ready focus returns after each item/destination/quantity action');
 await scan('CFG:CMD:HANDOVER_CHOICES');check(document.querySelectorAll('[data-choice]').length===3,'All unsaved decisions are visible before approval');
 await scan('CFG:CMD:HANDOVER_REASON');await scan('Trip ended');await scan('CFG:CMD:HANDOVER_APPROVE');await scan('CFG:CMD:CONFIRM');await until(()=>!view.app.state.busy&&view.app.state.detail?.mixed_recovery);
 check(calls.filter(c=>c.method.endsWith('create_mixed_dispatch_recovery')).length===1,'Explicit Confirm creates one frozen per-item approval');
 check(view.app.state.view==='movements','Approved instructions expose existing destination movements');
 check([...document.querySelectorAll('[data-handover="approve"]')].every(el=>el.disabled),'Frozen instructions cannot be edited through the approval button');
 await scan('CFG:SELECT:2');check(opened.some(row=>row[0]==='movement'&&row[1]==='KMF-QC'),'Second destination opens its exact existing recovery checklist');
 view.hide();await view.show('KTRIP-DEMO');await view.app.selectPlan('DPL-DEMO');
 click('[data-handover="camera"]');await until(()=>camera);const oldCamera=camera;oldCamera.options.on_scan({decodedText:'CFG:CMD:HANDOVER_RETURNS'});await pause(40);
 check(view.app.state.view==='returns','Camera scans use the same handover commands');
 check(document.activeElement===input(),'Camera completion restores Scanner Ready focus');
 await scan('CFG:SELECT:1');check(opened.some(row=>row[0]==='kanban-return-qc'&&row[1]==='KRTN-DEMO'),'Collected old return opens existing QC case without creating stock');
 route=['kanban-trip-handover','KTRIP-DEMO'];view.hide();await view.show('KTRIP-DEMO');
 click('[data-handover="change"]');await pause(30);check(view.app.state.context===null&&!document.querySelector('.cfg-trip-handover').textContent.includes('Demo Customer'),'Changing operator removes previous customer/stock details');
 oldCamera.options.on_scan({decodedText:'TAG1'});await pause(30);check(view.app.state.context===null,'Late camera callback cannot restore old operator details');
 storage.setItem('cfg_kanban_operator_session','DEMO-TOKEN');await view.show('KTRIP-DEMO');await view.app.selectPlan('DPL-DEMO');detail.mixed_recovery=null;view.app.state.detail.mixed_recovery=null;
 await chooseItem(1,1);await chooseItem(2,2);await scan('CFG:CMD:HANDOVER_REASON');await scan('End trip');await scan('CFG:CMD:HANDOVER_APPROVE');failOnce=true;await scan('CFG:CMD:CONFIRM');await until(()=>view.app.state.pending);
 const first=calls.filter(c=>c.method.endsWith('create_mixed_dispatch_recovery')).at(-1);view.hide();await view.show('KTRIP-DEMO');check(!!view.app.state.pending,'Unknown approval is preserved across page reopening in real browser storage');
 await scan('CFG:CMD:CONFIRM');await until(()=>!view.app.state.busy&&!view.app.state.pending);const retry=calls.filter(c=>c.method.endsWith('create_mixed_dispatch_recovery')).at(-1);
 check(JSON.stringify(first.args)===JSON.stringify(retry.args),'Unknown request retries the original quantities, hash, reason and event token');
 await scan('CFG:CMD:CANCEL');check(document.activeElement===input(),'Safe Cancel restores scanner focus without cancelling recorded stock work');
 const result={passed:results.length,checks:results,userAgent:navigator.userAgent,scope:'Offline demo RPC and camera only; no site or physical stock/ERP/QC acceptance'};document.getElementById('result').textContent=JSON.stringify(result,null,2);return result;
};
